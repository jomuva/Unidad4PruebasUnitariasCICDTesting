name: CI - Integración Continua

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      # ETAPA 1: Checkout del código
      - name: Checkout del código
        uses: actions/checkout@v4

      # ETAPA 2: Instalación de dependencias (Java 17 + Maven)
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # ETAPA 3: Ejecución de pruebas
      - name: Compilar y ejecutar pruebas
        run: mvn clean verify

      # ETAPA 4 (Opcional): Análisis estático de código
      - name: Generar reporte de cobertura
        run: mvn jacoco:report

      - name: Publicar reporte de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/